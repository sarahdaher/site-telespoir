server {
    listen       80;
    listen  [::]:80;
    server_name telespoir.fr www.telespoir.fr;

    root   /root/site-telespoir;
    index  index.html index.htm;

    # Pas de cache pour HTML, CSS, JS
    location ~* \.(html|htm|css|js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Cache long pour images
    location ~* \.(jpg|jpeg|png|gif|svg|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # FRONTEND TREASURER
    location /treasurer/ {
        index index.html;
    }

    # API TREASURER
    location /treasurer-api/ {
        proxy_pass http://172.17.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /epicerie/admin.html {
    auth_basic "Accès restreint";
    auth_basic_user_file /etc/nginx/.htpasswd;
}

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /root/site-telespoir;
    }
}
