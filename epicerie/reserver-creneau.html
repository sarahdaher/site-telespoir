<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réserver un créneau • Épicerie Télespoir</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #273070;
  --blue-light: #3a47a3;
  --blue-pale: #eef0f9;
  --red: #c0392b;
  --green: #1a8a5a;
  --text: #1a1a2e;
  --muted: #8888aa;
  --white: #ffffff;
  --radius: 12px;
  --shadow: 0 4px 20px rgba(39,48,112,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #f3f4f9;
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 60px;
}
header {
  background: var(--blue);
  color: white;
  text-align: center;
  padding: 32px 20px 28px;
}
header h1 { font-family: 'DM Serif Display', serif; font-size: 2rem; margin-bottom: 4px; }
header p { font-size: 0.9rem; opacity: 0.7; font-weight: 300; }
.page { max-width: 680px; margin: 0 auto; padding: 28px 16px 0; display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
.card-title { font-family: 'DM Serif Display', serif; font-size: 1.2rem; color: var(--blue); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.field-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
input[type="text"], input[type="email"] {
  width: 100%; padding: 11px 14px; border: 1.5px solid #dde0ef; border-radius: 8px;
  font-family: 'DM Sans', sans-serif; font-size: 0.95rem; color: var(--text);
  transition: border 0.2s; background: #fafbff;
}
input:focus { outline: none; border-color: var(--blue); background: white; }
input:disabled { background: #f5f5f5; color: #aaa; cursor: not-allowed; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.18s; }
.btn-primary { background: var(--blue); color: white; }
.btn-primary:hover { background: var(--blue-light); }
#slots-list { display: flex; flex-direction: column; gap: 8px; }
.slot-btn { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1.5px solid #dde0ef; border-radius: 8px; background: #fafbff; cursor: pointer; transition: all 0.18s; font-size: 0.95rem; }
.slot-btn:not(.taken):hover { border-color: var(--blue); background: var(--blue-pale); color: var(--blue); }
.slot-btn.taken { background: #f5f5f5; color: #aaa; cursor: not-allowed; border-color: #e0e0e0; }
.slot-badge { font-size: 0.75rem; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: #ffe0de; color: var(--red); }
.slot-badge.free { background: #d4f2e5; color: var(--green); }
.empty-state { text-align: center; color: var(--muted); padding: 24px 0; font-size: 0.9rem; }
.success-banner { background: #d4f2e5; color: var(--green); border-radius: 8px; padding: 12px 16px; font-weight: 500; display: none; margin-top: 10px; font-size: 0.9rem; }
.success-banner.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>🛒 Épicerie Télespoir</h1>
  <p>Réservez votre créneau de passage</p>
</header>
<div class="page">
  <div class="card">
    <div class="card-title"><span>📋</span> Vos informations</div>
    <div class="field-group">
      <input type="text" id="prenom" placeholder="Prénom">
      <input type="text" id="name" placeholder="Nom">
      <input type="email" id="email" placeholder="Email">
    </div>
    <div class="card-title" style="margin-top:8px"><span>🗓️</span> Créneaux disponibles</div>
    <div id="slots-list"><div class="empty-state">Chargement…</div></div>
    <div class="success-banner" id="success-msg">✅ Réservation confirmée ! Un email vous a été envoyé.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3.2.0/dist/email.min.js"></script>
<script>
emailjs.init("q_q1Ymuq0qOD8IG6a");

const firebaseConfig = {
  apiKey: "AIzaSyDKpM_xwciFWOjHb18bONOO2N5c4jliQTM",
  authDomain: "creneaux-26.firebaseapp.com",
  databaseURL: "https://creneaux26-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "creneaux-26",
  storageBucket: "creneaux-26.appspot.com",
  messagingSenderId: "925270932823",
  appId: "1:925270932823:web:1b0c438422145e3c30d212"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let slotsData = {};

function loadSlots() {
  db.ref('slots').on('value', snap => {
    slotsData = snap.val() || {};
    renderSlots();
  });
}

function renderSlots() {
  const div = document.getElementById("slots-list");
  const keys = Object.keys(slotsData).sort();
  if (!keys.length) { div.innerHTML = '<div class="empty-state">Aucun créneau disponible pour le moment.</div>'; return; }
  div.innerHTML = "";
  keys.forEach(slot => {
    const taken = slotsData[slot] !== false && slotsData[slot] !== null;
    const el = document.createElement("div");
    el.className = "slot-btn" + (taken ? " taken" : "");
    el.innerHTML = `<span>${slot}</span><span class="slot-badge ${taken ? '' : 'free'}">${taken ? 'Réservé' : 'Disponible'}</span>`;
    if (!taken) el.onclick = () => reserve(slot);
    div.appendChild(el);
  });
}

async function reserve(slot) {
  const prenom = document.getElementById("prenom").value.trim();
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  if (!prenom || !name || !email) { alert("Remplis tous les champs !"); return; }
  const snap = await db.ref('slots/' + slot).get();
  if (snap.exists() && snap.val() !== false) { alert("Désolé, ce créneau vient d'être pris !"); return; }
  await db.ref('slots/' + slot).set({ nom: name, prenom, email });
  emailjs.send("service_98v3zye", "template_ii2jcrg", { name, prenom, email, slot });
  emailjs.send("service_98v3zye", "template_glyge5x", { name, prenom, email, slot });
  document.getElementById("success-msg").classList.add("show");
  ["prenom","name","email"].forEach(id => document.getElementById(id).disabled = true);
}

loadSlots();
</script>
</body>
</html>
